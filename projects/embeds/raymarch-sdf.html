<!DOCTYPE html>
<html lang="en">
<head>
<!-- Live raymarch demo for page-studies.html; renders on demand -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex"> <!-- iframe content, not a page of its own -->
<title>Raymarch Live Demo — Noah Kasper</title>
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Mirrors the style.css tokens; an iframe can't inherit them */
  :root {
    --void:      #0A0B0D;
    --steel:     #1C1E22;
    --ink:       #ECECF0;
    --ink-dim:   #8a8a92;
    --ink-faint: #62626b;
    --cyan:      #00E5FF;
    --f-ui:      'Share Tech Mono', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    background: #000; /* same black as the shader's sky, so no seam before the first frame */
    overflow: hidden;
    font-family: var(--f-ui);
  }

  #wrap {
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
  }

  #c {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    cursor: grab;
    touch-action: pan-y; /* vertical swipes scroll the page; horizontal drags orbit */
  }
  #c.is-dragging { cursor: grabbing; }

  #controls {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px 24px;
    padding: 8px 16px;
    background: var(--void);
    border-top: 1px solid var(--steel);
    font-size: 11px;
    color: var(--ink-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    flex-wrap: wrap;
  }

  #controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: default;
  }

  #psv {
    min-width: 2ch;
    color: var(--ink);
  }

  #controls input[type=range] {
    accent-color: var(--cyan);
    width: 80px;
    cursor: pointer;
  }

  #controls select {
    background: var(--void);
    color: var(--ink);
    border: 1px solid var(--ink-faint);
    font-family: var(--f-ui);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 2px 4px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  #controls select:hover {
    border-color: var(--cyan);
  }

  #controls option {
    background: var(--void);
    color: var(--ink);
  }

  #controls select:focus-visible,
  #controls input[type=range]:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }

  /* focus ring drawn inside the canvas */
  #c:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: -2px;
  }

  #hint {
    margin-left: auto;
    white-space: nowrap; /* wraps to its own row as a whole */
  }

  /* Touch screens have no Ctrl+wheel, so only the drag hint applies */
  @media (hover: none) and (pointer: coarse) {
    .hint-zoom { display: none; }
  }

  /* Narrow frame: drop the zoom hint to keep the bar on one row */
  @media (max-width: 720px) {
    .hint-zoom { display: none; }
  }

  /* Phone-size frame: keep the bar to one row */
  @media (max-width: 480px) {
    #controls { gap: 6px 16px; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" tabindex="0" role="img" aria-label="Raymarched planet and rings drawn as a grid of dots. Drag or use the arrow keys to orbit; plus and minus zoom."></canvas>
  <div id="controls">
    <label>PIXEL
      <input id="ps" type="range" min="3" max="16" value="7" step="1">
      <span id="psv" aria-hidden="true">7</span>
    </label>
    <label>PALETTE
      <select id="pal">
        <option value="0">AMBER</option>
        <option value="1">PHOSPHOR</option>
        <option value="2" selected>CGA</option>
        <option value="3">GAME BOY</option>
        <option value="4">ZX SPECTRUM</option>
        <option value="5">PC-98</option>
        <option value="6">RADAR</option>
        <option value="7">C64</option>
      </select>
    </label>
    <span id="hint">Drag to orbit<span class="hint-zoom"> · Ctrl+scroll to zoom</span></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');

// Dot size is tuned for this height; dots scale with the frame
const REFERENCE_HEIGHT = 690;
const MIN_CELL = 2; // device px; smaller cells read as noise
let pixelSlider = 7;

// Drawing-buffer size at device pixel ratio, capped at 2x
function getCanvasSize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  return {
    width:  Math.max(1, Math.round((canvas.clientWidth  || 1) * dpr)),
    height: Math.max(1, Math.round((canvas.clientHeight || 1) * dpr)),
  };
}

let { width, height } = getCanvasSize();
canvas.width = width;
canvas.height = height;

// Cell size in device px for the current canvas height
function cellSize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssHeight = canvas.height / dpr;
  return Math.max(MIN_CELL, pixelSlider * dpr * (cssHeight / REFERENCE_HEIGHT));
}

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setSize(width, height, false);

// Camera rotation (radians)
let rotationX = 0.3;
let rotationY = 0.4;
let cameraDistance = 6.0;

// Drag state
let dragPointerId = null;
let prevPointerX = 0;
let prevPointerY = 0;

// Pointer capture keeps the drag alive outside the canvas
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || dragPointerId !== null) return;
  dragPointerId = e.pointerId;
  prevPointerX = e.clientX;
  prevPointerY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('is-dragging');
});

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== dragPointerId) return;
  rotationY += (e.clientX - prevPointerX) * 0.01;
  rotationX += (e.clientY - prevPointerY) * 0.01;
  rotationX = Math.max(-1.4, Math.min(1.4, rotationX));
  prevPointerX = e.clientX;
  prevPointerY = e.clientY;
  requestRender();
});

// pointercancel fires when the browser takes a touch to scroll
function endDrag(e) {
  if (e.pointerId !== dragPointerId) return;
  dragPointerId = null;
  canvas.classList.remove('is-dragging');
}
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
  canvas.addEventListener(type, endDrag);
});

// Zoom only on Ctrl/Cmd + wheel (a trackpad pinch also arrives as ctrlKey),
// so a plain scroll over the demo still scrolls the host page.
canvas.addEventListener('wheel', e => {
  if (!e.ctrlKey && !e.metaKey) return;
  e.preventDefault();
  const deltaY = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY; // Firefox reports lines, not pixels
  cameraDistance = Math.max(3.0, Math.min(12.0, cameraDistance + deltaY * 0.01));
  requestRender();
}, { passive: false });

// Keyboard orbit: arrows rotate, +/- zoom
canvas.addEventListener('keydown', e => {
  const STEP = 0.12;
  switch (e.key) {
    case 'ArrowLeft':  rotationY -= STEP; break;
    case 'ArrowRight': rotationY += STEP; break;
    case 'ArrowUp':    rotationX = Math.max(-1.4, rotationX - STEP); break;
    case 'ArrowDown':  rotationX = Math.min(1.4, rotationX + STEP); break;
    case '+': case '=': cameraDistance = Math.max(3.0, cameraDistance - 0.4); break;
    case '-': case '_': cameraDistance = Math.min(12.0, cameraDistance + 0.4); break;
    default: return;
  }
  e.preventDefault();
  requestRender();
});


const shaderUniforms = {
  resolution: { value: new THREE.Vector2(width, height) },
  pixelSize:   { value: cellSize() },
  palette:     { value: 2.0 }, // default: CGA
  rotationX:   { value: rotationX },
  rotationY:   { value: rotationY },
  cameraDistance: { value: cameraDistance }
};

const shaderMaterial = new THREE.ShaderMaterial({
  uniforms: shaderUniforms,
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.); }`,
  fragmentShader:
  `precision mediump float;
uniform vec2 resolution;
uniform float pixelSize, palette, rotationX, rotationY, cameraDistance;
varying vec2 vUv;

// Random hash used for star field
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5); }

vec3 rotateX(vec3 p, float angle) { float c=cos(angle), s=sin(angle); return vec3(p.x, p.y*c - p.z*s, p.y*s + p.z*c); }
vec3 rotateY(vec3 p, float angle) { float c=cos(angle), s=sin(angle); return vec3(p.x*c + p.z*s, p.y, -p.x*s + p.z*c); }

// SDF primitives
float sdSphere(vec3 p, float radius){ return length(p) - radius; }
float sdTorus(vec3 p, float majorRadius, float minorRadius){ return length(vec2(length(p.xz) - majorRadius, p.y)) - minorRadius; }
float sdFlatRing(vec3 p, float innerR, float outerR, float thickness) {
  float radial = length(p.xz);
  float ringBand = max(innerR - radial, radial - outerR);
  float vertical = abs(p.y) - thickness;
  return max(ringBand, vertical);
}

const float RING_TILT = -0.5;

// Scene: planet plus both rings
float sceneSDF(vec3 pos) {
  vec3 rotatedPos = rotateY(rotateX(pos, rotationX), rotationY);
  float planet = sdSphere(rotatedPos, 1.0);
  vec3 ringPos = rotateX(rotatedPos, RING_TILT);

  float innerRing = sdFlatRing(ringPos, 1.6, 1.85, 0.015);
  float outerRing = sdFlatRing(ringPos, 2.05, 2.35, 0.01);

  return min(planet, min(innerRing, outerRing));
}

// 0 = planet, 1 = inner ring, 2 = outer ring
float hitPart(vec3 pos) {

  vec3 rotatedPos = rotateY(rotateX(pos, rotationX), rotationY);
  float planet = sdSphere(rotatedPos, 1.0);
  vec3 ringPos = rotateX(rotatedPos, RING_TILT);
  float innerRing = sdFlatRing(ringPos, 1.6, 1.85, 0.015);
  float outerRing = sdFlatRing(ringPos, 2.05, 2.35, 0.01);
  float closest = min(planet, min(innerRing, outerRing));

  if(abs(closest - planet) < 0.001) return 0.;
  if(abs(closest - innerRing) < 0.001) return 1.;
  return 2.;
}

vec3 getSurfaceNormal(vec3 pos){
  float epsilon = 0.001;
  return normalize(vec3(

    sceneSDF(pos + vec3(epsilon,0,0)) - sceneSDF(pos - vec3(epsilon,0,0)),
    sceneSDF(pos + vec3(0,epsilon,0)) - sceneSDF(pos - vec3(0,epsilon,0)),
    sceneSDF(pos + vec3(0,0,epsilon)) - sceneSDF(pos - vec3(0,0,epsilon))
  ));
}

// Returns (brightness, partId); partId -1 is background
vec2 marchRay(vec2 uv) {
  float aspectRatio = resolution.x / resolution.y;
  vec3 rayOrigin = vec3(0., 0., cameraDistance);
  vec3 rayDir = normalize(vec3((uv * 2. - 1.) * vec2(aspectRatio, 1.), -2.5));
  float dist = 0.5;

  for(int step = 0; step < 80; step++) {
    float closest = sceneSDF(rayOrigin + rayDir * dist);

    if (closest < 0.002) {
      // Compute lighting
      vec3 hitPos = rayOrigin + rayDir * dist;
      vec3 normal = getSurfaceNormal(hitPos);
      float partId = hitPart(hitPos);

      vec3 keyLight = normalize(vec3(3.,  4.,  5.));
      vec3 fillLight = normalize(vec3(-2., -1., 3.));

      float diffuse = max(dot(normal, keyLight), 0.) * 0.85 + max(dot(normal, fillLight), 0.) * 0.25;
      float specular = pow(max(dot(reflect(-keyLight, normal), -rayDir), 0.), 48.) * 0.55;
      float rim = pow(1. - max(dot(normal, -rayDir), 0.), 4.) * 0.3;
      float brightness = clamp(diffuse + specular + rim + 0.08, 0., 1.);

      if (partId > 0.5) brightness *= 0.78;
      return vec2(brightness, partId);
    }

    if(dist > cameraDistance * 2.5) break; // ray escaped scene
    dist += closest;
  }

  // Background: sparse star field
  vec2 starCell = floor(rayDir.xy * 90. + rayDir.z * 40.);
  float starHash = hash(starCell);
  return vec2(starHash > 0.977 ? (starHash - 0.977) / 0.023 * 0.55 : 0., -1.);
}

// Brightness and part to RGB for the selected palette
vec3 applyPalette(float brightness, float partId, float paletteIndex){
  vec3 baseColor;

  // 0: AMBER
  if (paletteIndex < 0.5) {
    if (partId < 0.5 && partId >= 0.) baseColor = vec3(1., .6, .05);
    else baseColor = vec3(1., .42, .02);
    return baseColor * brightness * 1.4;

  // 1: PHOSPHOR
  } else if(paletteIndex < 1.5) {
    baseColor = vec3(.1, 1., .22);
    return baseColor * brightness * 1.4;

  // 2: CGA
  } else if(paletteIndex < 2.5){
    vec3 black = vec3(0.), cyan = vec3(0.,.7,.7), ltBlue = vec3(.8,.8,1.), white = vec3(1.);

    if (brightness < .33) return mix(black, cyan, brightness * 3.);
    else if (brightness < .66) return mix(cyan, ltBlue, (brightness-.33)*3.);
    else return mix(ltBlue, white, (brightness-.66)*3.);

  // 3: GAMEBOY
  } else if(paletteIndex < 3.5) {
    vec3 shades[4];
    shades[0] = vec3(0.059, 0.220, 0.059);
    shades[1] = vec3(0.188, 0.384, 0.188);
    shades[2] = vec3(0.545, 0.675, 0.059);
    shades[3] = vec3(0.608, 0.737, 0.059);
    float indexF = clamp(brightness * 3.99, 0., 3.99);
    int   indexI = int(indexF);
    float blend = fract(indexF);
    vec3 colorA, colorB;

    if (indexI == 0)
    {
      colorA = shades[0]; colorB = shades[1];
    }
    else if (indexI == 1)
    {
      colorA = shades[1]; colorB = shades[2];
    }
    else
    {
      colorA = shades[2]; colorB = shades[3];
    }

    return mix(colorA, colorB, blend);

  // 4: ZX SPECTRUM
  } else if(paletteIndex < 4.5) {
    vec3 tint;

    if(partId < 0.5 && partId >= 0.) tint = vec3(0.8, 0.0, 0.8);
    else tint = vec3(0.0, 0.8, 0.8);
    return tint * brightness * 1.3;

  // 5: PC-98
  } else if(paletteIndex < 5.5) {
    vec3 shadow = vec3(0.0, 0.0, 0.18);
    vec3 midTone = vec3(0.7, 0.0, 0.6);
    vec3 highlight = vec3(1.0, 0.75, 1.0);

    if (brightness < 0.5) return mix(shadow, midTone, brightness * 2.);
    else return mix(midTone, highlight, (brightness - 0.5) * 2.);

  // 6: RADAR
  } else if (paletteIndex < 6.5) {
    vec3 dark = vec3(0.0, 0.0, 0.0);
    vec3 midRed = vec3(0.6, 0.0, 0.0);
    vec3 hotRed = vec3(1.0, 0.15, 0.0);

    if(brightness < 0.5) return mix(dark, midRed, brightness * 2.);
    else return mix(midRed, hotRed, (brightness - 0.5) * 2.);

  // 7: C64
  } else {
    vec3 navyBlue = vec3(0.067, 0.114, 0.455);
    vec3 periwinkle = vec3(0.353, 0.408, 0.816);
    vec3 paleBlue = vec3(0.686, 0.718, 1.0);

    if(brightness < 0.4) return mix(navyBlue, periwinkle, brightness / 0.4);
    else return mix(periwinkle, paleBlue, (brightness - 0.4) / 0.6);
  }
}

void main(){

  vec2 cellSize = vec2(pixelSize) / resolution;
  vec2 cellCoord = floor(vUv / cellSize);
  vec2 cellLocalUv = fract(vUv / cellSize); // position within the cell (0-1)

  vec2 rayResult = marchRay((cellCoord + 0.5) * cellSize);
  float brightness = rayResult.x;
  float partId = rayResult.y;

  // Each cell is a dot sized by brightness
  float distToCenter = length(cellLocalUv - vec2(0.5));
  float dotRadius = brightness * 0.47 + 0.01;
  float dotMask = smoothstep(dotRadius + 0.04, dotRadius - 0.04, distToCenter);
  float glowHalo = smoothstep(dotRadius + 0.2, dotRadius, distToCenter) * 0.18 * (1. - dotMask);

  vec3 color = applyPalette(brightness, partId, palette) * (dotMask + glowHalo);

  color *= 1. - 0.45 * pow(sin(vUv.y * resolution.y * 3.14159), 2.);

  // Vignette
  vec2 vignetteUv = vUv * 2. - 1.;
  color *= pow(clamp(1. - dot(vignetteUv * .55, vignetteUv * .55), 0., 1.), 1.5);

  gl_FragColor = vec4(clamp(color, 0., 1.), 1.);
}
`});

// Shader drawn on a fullscreen quad
const scene = new THREE.Scene();
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), shaderMaterial));
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// Pixel size slider
document.getElementById('ps').oninput = function() {
  pixelSlider = +this.value;
  shaderUniforms.pixelSize.value = cellSize();
  document.getElementById('psv').textContent = this.value;
  requestRender();
};

// Palette dropdown
document.getElementById('pal').onchange = function() {
  shaderUniforms.palette.value = +this.value;
  requestRender();
};

// Render on demand; requestRender() batches calls into one frame
let frameRequest = 0;

function drawFrame() {
  if (frameRequest) cancelAnimationFrame(frameRequest);
  frameRequest = 0;
  shaderUniforms.rotationX.value      = rotationX;
  shaderUniforms.rotationY.value      = rotationY;
  shaderUniforms.cameraDistance.value = cameraDistance;
  renderer.render(scene, orthoCam);
}

function requestRender() {
  if (!frameRequest) frameRequest = requestAnimationFrame(drawFrame);
}

// Resizing clears the canvas; redraw now (observer runs before paint)
const resizeObserver = new ResizeObserver(() => {
  const { width: newWidth, height: newHeight } = getCanvasSize();
  if (newWidth === canvas.width && newHeight === canvas.height) return;
  canvas.width = newWidth;
  canvas.height = newHeight;
  renderer.setSize(newWidth, newHeight, false);
  shaderUniforms.resolution.value.set(newWidth, newHeight);
  shaderUniforms.pixelSize.value = cellSize();
  drawFrame();
});
resizeObserver.observe(canvas);

// Repaint once a lost WebGL context is restored
canvas.addEventListener('webglcontextrestored', requestRender);

requestRender();
</script>
</body>
</html>
