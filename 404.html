<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Noah Kasper</title>
  <meta name="robots" content="noindex">
  <script>
    // links from when the site lived under /portfolio/ go to the same page at the root
    (function () {
      var p = location.pathname;
      if (/^\/portfolio(\/|$)/.test(p)) {
        location.replace(p.replace(/^\/portfolio\/?/, '/') + location.search + location.hash);
      }
    })();
  </script>
  <link rel="icon" href="/favicon-32.png?v=3" type="image/png" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">

  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=87">
</head>
<body>
  <main style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; max-width: 1200px; margin: 0 auto;">
